services:
  postgres:
    image: postgres:16-alpine
    container_name: hfd-growth-os-postgres
    environment:
      POSTGRES_USER: hfd
      POSTGRES_PASSWORD: hfd_local_dev
      POSTGRES_DB: hfd_growth_os
    ports:
      - "5432:5432"
    volumes:
      - hfd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfd -d hfd_growth_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hfd_pg_data:
