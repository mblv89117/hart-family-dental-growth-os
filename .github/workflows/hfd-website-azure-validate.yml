# Builds the Hart Family Dental site and deploys it to the temporary
# Azure Container Apps hostname only. Does not bind hfdds.net, does not
# change DNS, and does not update the Vercel project.
#
# Run manually after an admin has applied infra/azure/hfd-website and created
# the Key Vault secrets named in that template. This workflow does not run
# on push.

name: HFD website Azure validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hfd-website-azure-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Build, deploy validation hostname, smoke
    runs-on: ubuntu-latest
    environment: hfd-website-validation
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE_TAG: hfd-website:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require isolated HFD resource names
        run: |
          test -n "$RESOURCE_GROUP"
          test -n "$ACR_NAME"
          test -n "$CONTAINER_APP"
          echo "Resource group: $RESOURCE_GROUP"
          echo "Registry: $ACR_NAME"
          echo "Container app: $CONTAINER_APP"

      - name: Build image in this client's ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_TAG" \
            --file website/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL=https://hfdds.net \
            --build-arg HFD_ENABLE_HSTS=true \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_GTM_ID="${{ vars.NEXT_PUBLIC_GTM_ID }}" \
            --build-arg NEXT_PUBLIC_CLARITY_ID="${{ vars.NEXT_PUBLIC_CLARITY_ID }}" \
            --build-arg NEXT_PUBLIC_META_PIXEL_ID="${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ADS_ID="${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}" \
            --build-arg NEXT_PUBLIC_CALLRAIL_SWAP_SCRIPT_URL="${{ vars.NEXT_PUBLIC_CALLRAIL_SWAP_SCRIPT_URL }}" \
            website

      - name: Deploy to the validation hostname only
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${LOGIN_SERVER}/${IMAGE_TAG}" \
            --revision-suffix "v${GITHUB_SHA::8}"
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.customDomains" \
            -o json

      - name: Smoke test the Azure hostname
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Validation origin: https://${FQDN}"
          node website/scripts/azure-smoke.mjs "https://${FQDN}" --require-hsts
